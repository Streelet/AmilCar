name: amilcar
description: ERP / Kanban para Mecánica Express Móvil e Internacional.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Backend / Realtime ---
  supabase_flutter: ^2.8.0

  # --- Configuración segura de credenciales ---
  flutter_dotenv: ^5.2.1

  # --- Gestión de estado ---
  flutter_riverpod: ^2.6.1

  # --- Tipografía Manrope (DESIGN.md) ---
  google_fonts: ^6.2.1

  # --- Selección de archivos (subir PDFs y fotos en el modal) ---
  # 10.3.10+: usa flutter.compileSdkVersion y aplica el plugin de Kotlin
  # explícitamente. La serie 11.x rompe el build con AGP 9 + builtInKotlin=false.
  file_picker: ^10.3.10

  cupertino_icons: ^1.0.8

  # --- Visor de PDF integrado (cotizaciones) ---
  pdfrx: ^2.2.24
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # El archivo .env se empaqueta como asset para flutter_dotenv.
  assets:
    - .env
    # PDF de ejemplo para los Estimados de demostración (modo Mockup).
    - assets/sample/estimado_demo.pdf
    # Branding: logo y assets de marca usados en AppBar, Login y Splash.
    - assets/branding/

# Configuración del ícono del launcher Android (paquete flutter_launcher_icons).
# Generá los íconos corriendo:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/logo.png"
  min_sdk_android: 21
  # Ícono adaptivo (Android 8+): fondo crema de la app + el logo como
  # foreground. El logo tiene transparencia y respeta su propio padding
  # interno, así que entra cómodo dentro de la máscara circular/squircle
  # que aplican los launchers.
  adaptive_icon_background: "#FAF9FE"
  adaptive_icon_foreground: "assets/branding/logo.png"
